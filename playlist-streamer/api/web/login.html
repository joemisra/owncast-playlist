<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream Manager Login</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#c9d1d9;font:14px system-ui}form{width:min(360px,calc(100vw - 2rem));background:#161b22;border:1px solid #30363d;border-radius:10px;padding:1.5rem}h1{font-size:1.1rem;margin:0 0 1rem}label{display:block;color:#8b949e;margin-bottom:.35rem}input,button{box-sizing:border-box;width:100%;padding:.65rem;border-radius:6px;font:inherit}input{background:#0d1117;border:1px solid #30363d;color:#fff}button{margin-top:.8rem;border:0;background:#6e58a8;color:#fff;cursor:pointer}#error{min-height:1.3rem;color:#f85149;margin-top:.6rem}
</style></head><body><form id="login-form"><h1>couch Stream Manager</h1><label for="password">Manager password</label><input id="password" type="password" autocomplete="current-password" autofocus required><button>Sign in for 2 hours</button><div id="error"></div></form><script src="login.js"></script></body></html>

# Playlist Streamer - Configuration
# Copy to config.local.yaml and set your stream key. Do not commit stream_key to git.

owncast:
  rtmp_url: "rtmp://localhost:1935/live"
  stream_key: "abc123"  # Change this - get from Owncast admin

streamer:
  ffmpeg_path: "ffmpeg"
  ytdlp_path: "yt-dlp"
  temp_dir: "data/tmp" # Where to store downloads before streaming (cleaned up after each video)
  cookies_file: ""     # Path to cookies.txt - export from logged-in browser to avoid YouTube bot detection
  # cookies_from_browser: "chrome"  # Or "firefox","chromium" if browser exists on server
  realtime: true       # Limit playback to realtime (don't speed through videos)
  loop_playlist: true   # When playlist ends, start over

playlists: "playlists"
